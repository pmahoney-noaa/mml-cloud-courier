[project]
name = "mml-cloud-courier"
version = "0.1.0"
description = "MML Cloud Courier: verified, resumable file transfers between Windows workstations and Google Cloud Storage"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-crc32c>=1.5.0",
    "google-cloud-storage>=3.0,<4",
    "requests>=2.31",
    "google-auth-oauthlib>=1.2",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "PySide6>=6.7,<7",
    "pytest-qt>=4.4",
]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
mmlcc = "mml_cloud_courier.cli.__main__:main"
mmlcc-service = "mml_cloud_courier.service.windows_service:main"

[project.gui-scripts]
mmlcc-gui = "mml_cloud_courier.gui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mml_cloud_courier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "emulator: requires fake-gcs-server (tools/fake-gcs-server.exe); skipped when absent",
    "real_bucket: requires MMLCC_TEST_BUCKET and real credentials; release gate",
    "slow: multi-gigabyte; minutes, not seconds",
    "gui: PySide6 widget tests (skipped when PySide6 is absent)",
]
