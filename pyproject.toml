[project]
name = "mml-cloud-transfer"
version = "0.1.0"
description = "Verified, resumable file transfers between Windows workstations and Google Cloud Storage"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-crc32c>=1.5.0",
    "google-cloud-storage>=3.0,<4",
    "requests>=2.31",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
mmlct = "mml_cloud_transfer.cli.__main__:main"
mmlct-service = "mml_cloud_transfer.service.windows_service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mml_cloud_transfer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "emulator: requires fake-gcs-server (tools/fake-gcs-server.exe); skipped when absent",
    "real_bucket: requires MMLCT_TEST_BUCKET and real credentials; release gate",
    "slow: multi-gigabyte; minutes, not seconds",
]
